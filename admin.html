<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة ATHNTA - لوحة التحكم الشاملة</title>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

    <div id="uploadProgress">
        <div id="pBar"></div>
    </div>
    <div id="toast" class="toast">تم الإجراء بنجاح! ✅</div>

    <header>
        <button class="logout-btn" data-bind-click="admin-1">خروج</button>
        <img src="https://i.ibb.co/4nNNrTY5/5-Dk-XXIEg7i-UZlzdd-Mb-FCA1-EBP00-Wu-JWzy9hg-Ovj8.avif" class="logo">
    </header>

    <div class="admin-mode-tabs">
        <button class="admin-mode-tab active" id="adminEmbroideryTab" data-bind-click="admin-2">
            إدارة التطريز
        </button>

        <button class="admin-mode-tab" id="adminPrintingTab" data-bind-click="admin-3">
            إدارة الطباعة
        </button>
    </div>

    <h2 class="current-mode-title" id="currentModeTitle">
        إدارة منتجات وأقسام التطريز
    </h2>

    <div class="tabs">
    <button class="active" id="btnProductsTab" data-bind-click="admin-4">
        المنتجات
    </button>

    <button id="btnCatsTab" data-bind-click="admin-5">
        التصنيفات
    </button>

    <button id="btnReviewsTab" data-bind-click="admin-6">
        التقييمات والآراء
    </button>
</div>

<div id="productsTab" class="tab-content active">
    <div class="admin-box">
        <h2>إضافة منتج ✨</h2>

        <input type="text" id="productName" placeholder="اسم المنتج">

        <div style="display:flex; gap:10px;">
            <select
                id="productMainCat"
                data-bind-change="admin-7">
            </select>

            <select id="productSubCat"></select>
        </div>

        <div
            class="drop-zone"
            id="prodDZ"
            data-bind-click="admin-8">

            <div
                id="prodPrevContainer"
                class="img-preview-container">
            </div>

            <span>اضغط لاختيار صور المنتج 📸</span>

            <input
                type="file"
                id="productFile"
                style="display:none;"
                multiple
                data-bind-change="admin-9">
        </div>

        <button
            class="action-btn"
            id="prodBtn"
            data-bind-click="admin-10">
            رفع وحفظ المنتج
        </button>
    </div>

    <div id="productsList"></div>
</div>

<div id="catsTab" class="tab-content">
    <div class="admin-box">
        <h2>قسم رئيسي جديد 🖼️</h2>

        <input
            type="text"
            id="newMainCat"
            placeholder="اسم القسم الرئيسي">

        <div
            class="drop-zone"
            id="catDZ"
            data-bind-click="admin-11">

            <div
                id="catPrevContainer"
                class="img-preview-container">
            </div>

            <span>صورة غلاف القسم 📂</span>

            <input
                type="file"
                id="catFile"
                style="display:none;"
                data-bind-change="admin-12">
        </div>

        <button
            class="action-btn"
            id="catBtn"
            data-bind-click="admin-13">
            إنشاء القسم
        </button>
    </div>

    <div class="admin-box">
        <h2>إضافة قسم فرعي 🔗</h2>

        <select id="mainCatForSub"></select>

        <input
            type="text"
            id="newSubCat"
            placeholder="اسم القسم الفرعي">

        <button
            class="action-btn"
            id="subBtn"
            data-bind-click="admin-14"
            style="background:#444; color:#fff;">
            إضافة فرعي
        </button>
    </div>

    <div id="categoriesAdminList"></div>
</div>

<div id="reviewsTab" class="tab-content">
    <div class="admin-box">
        <h2>رفع صور الآراء والمحادثات ⭐</h2>

        <div
            class="drop-zone"
            id="revDZ"
            data-bind-click="admin-15">

            <div
                id="revPrevContainer"
                class="img-preview-container">
            </div>

            <span>
                اضغط لاختيار صور التقييمات 📸
                يمكن اختيار أكثر من صورة
            </span>

            <input
                type="file"
                id="reviewFile"
                style="display:none;"
                multiple
                data-bind-change="admin-16">
        </div>

        <button
            class="action-btn"
            data-bind-click="admin-17">
            رفع الصور للمعرض
        </button>
    </div>

    <div class="admin-box">
        <h2>الآراء الحالية</h2>

        <div
            class="img-preview-container"
            id="reviewsAdminList"
            style="justify-content:flex-start; gap:15px;">
        </div>
    </div>
</div>

<div class="modal" id="editModal">
    <div class="modal-content">
        <h2 style="color:var(--primary)">
            تعديل المنتج والتحكم بالصور
        </h2>

        <input type="hidden" id="editId">

        <input
            type="text"
            id="editName"
            placeholder="اسم المنتج">

        <select
            id="editMainCat"
            data-bind-change="admin-18">
        </select>

        <select id="editSubCat"></select>

        <div
            style="margin-bottom:15px; background:#111; padding:15px; border-radius:10px; border:1px solid #333;">

            <label
                style="color:var(--primary); font-size:14px; display:block; margin-bottom:10px; font-weight:bold;">
                الصور الحالية اضغط ❌ للحذف
            </label>

            <div
                id="editPrevContainer"
                class="img-preview-container"
                style="justify-content:flex-start; gap:15px;">
            </div>
        </div>

        <div
            class="drop-zone"
            id="editDZ"
            data-bind-click="admin-19">

            <div
                id="newEditPrevContainer"
                class="img-preview-container">
            </div>

            <span>اضغط لإضافة صور جديدة 📸</span>

            <input
                type="file"
                id="editFile"
                style="display:none;"
                multiple
                data-bind-change="admin-20">
        </div>

        <div class="btn-group-large">
            <button
                class="edit-btn"
                id="updateBtn"
                data-bind-click="admin-21">
                حفظ التعديلات
            </button>

            <button
                class="danger-btn"
                data-bind-click="admin-22">
                إلغاء
            </button>
        </div>
    </div>
</div>
        
    <script src="js/firebase-config.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/admin-bindings.js"></script>
</body>

</html>
